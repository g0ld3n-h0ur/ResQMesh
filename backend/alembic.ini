# ===========================================================================
# alembic.ini — Alembic database migration configuration
# AI Disaster Relief Coordination Platform
# ===========================================================================

[alembic]
# Path to the Alembic migration environment script
script_location = alembic

# Template for generating migration filenames
# Default: %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Truncate the revision identifiers (set to 0 for full SHA)
truncate_slug_length = 40

# Allow Alembic to exit with code 0 when no new revisions exist
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Database URL
# ---------------------------------------------------------------------------
# Override via DATABASE_URL environment variable in env.py (recommended).
# This value is only used as a fallback when no env var is present.
sqlalchemy.url = sqlite:///./disaster_relief.db

# ===========================================================================
# Logging configuration
# ===========================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
